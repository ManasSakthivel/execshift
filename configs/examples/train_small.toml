# POST-STUDY / EXPLORATORY PPO training (a few minutes on CPU).
# Episodes come from training streams >= 50,000, disjoint from the study's.
# Run:   execshift train --config configs/examples/train_small.toml
# Then evaluate the result with a policy spec printed in the run manifest
# (extra.policy_spec), e.g. {kind = "ppo", models_dir = "runs/<id>/models", ensemble_size = 2}.
[experiment]
name = "ppo-small"
kind = "train"

[market]
conditions = ["ID"]
impact_model = "sqrt"

[model]
pi_layers = [64, 64]
vf_layers = [64, 64]
log_std_init = -1.0

[training]
total_steps = 200000
n_envs = 64
seeds = [1000, 1001]
