[project]
name = "adexec"
version = "1.1.0"
description = "ExecShift: a pre-registered robustness benchmark for RL trade execution under distribution shift (synthetic markets)"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Manas Sakthivel" }]
keywords = ["market microstructure", "optimal execution", "reinforcement learning",
            "distribution shift", "selective prediction", "pre-registration"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.5",
  "torch>=2.2",
  "stable-baselines3>=2.3",
  "gymnasium>=0.29",
]

[project.urls]
Repository = "https://github.com/ManasSakthivel/execshift"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
execshift = "adexec.cli:main"
quant-exec = "adexec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adexec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: needs the study's PPO checkpoints or raw outputs (git-ignored); skipped when absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# document renderers: long Markdown table rows are clearer unwrapped
"adexec/reporting/study_report.py" = ["E501"]
"adexec/reporting/tables.py" = ["E501"]
"adexec/reporting/sim_report.py" = ["E501"]
"adexec/reporting/study_figures.py" = ["E501"]
"adexec/reporting/supplementary.py" = ["E501"]

[tool.ruff.format]
# The pre-registration lock hashes these files byte for byte: never reformat them.
exclude = ["adexec/config.py", "adexec/sim.py", "adexec/policies.py", "adexec/rl.py",
           "adexec/features.py", "adexec/gates.py", "adexec/stats.py", "adexec/analysis.py",
           "adexec/tuning.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
# Type-checked: the post-study platform layers. The frozen study modules are excluded
# (they cannot be edited to satisfy a checker without breaking the pre-registration lock).
files = ["adexec/interfaces.py", "adexec/paths.py", "adexec/experiments",
         "adexec/benchmarks", "adexec/evaluation", "adexec/market", "adexec/agents",
         "adexec/uncertainty", "adexec/cli"]
